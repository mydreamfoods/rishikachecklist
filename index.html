<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Checklist — My Dream Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f8;
  --surface:#ffffff;
  --surface2:#f6f7fb;
  --surface3:#eceef6;
  --border:rgba(79,70,229,0.1);
  --border2:rgba(79,70,229,0.22);
  --text:#1a1b2e;
  --muted:#64748b;
  --muted2:#94a3b8;
  --accent:#4f46e5;
  --accent-lt:#eef2ff;
  --green:#059669;
  --green-bg:#ecfdf5;
  --green-txt:#065f46;
  --green-bd:rgba(5,150,105,0.18);
  --amber:#d97706;
  --amber-bg:#fffbeb;
  --amber-txt:#92400e;
  --amber-bd:rgba(217,119,6,0.18);
  --red:#dc2626;
  --red-bg:#fef2f2;
  --purple:#7c3aed;
  --purple-bg:#f5f3ff;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --r:10px;--rl:14px;
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --sh:0 1px 3px rgba(0,0,0,0.07),0 4px 16px rgba(79,70,229,0.07);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:1.75rem 1.25rem;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto}

/* TOP BAR */
.topbar{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);border-radius:var(--rl);padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(79,70,229,0.3)}
.topbar-left{display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.brand{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;font-weight:600}
.title{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.02em}
.topbar-right{display:flex;align-items:center;gap:10px}
.date-pill{font-size:12px;color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);padding:5px 12px;border-radius:20px;font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 14px;border:1px solid rgba(255,255,255,0.3);border-radius:var(--r);background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-family:var(--font);font-weight:500;transition:all .2s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.btn:hover{background:rgba(255,255,255,0.28)}
.btn.spinning i{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem}
@media(max-width:620px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--surface);border-radius:var(--rl);padding:1.2rem 1.25rem 1rem;position:relative;overflow:hidden;transition:-webkit-transform .2s,transform .2s,box-shadow .2s;box-shadow:var(--sh)}
.card:hover{-webkit-transform:translateY(-2px);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.1)}
.card-top-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--rl) var(--rl) 0 0}
.card.total .card-top-bar{background:linear-gradient(90deg,#4f46e5,#7c3aed)}
.card.green .card-top-bar{background:linear-gradient(90deg,#059669,#10b981)}
.card.amber .card-top-bar{background:linear-gradient(90deg,#d97706,#f59e0b)}
.card.blue  .card-top-bar{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.card-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:12px;margin-top:6px}
.card.total .card-icon{background:var(--purple-bg);color:var(--purple)}
.card.green .card-icon{background:var(--green-bg);color:var(--green)}
.card.amber .card-icon{background:var(--amber-bg);color:var(--amber)}
.card.blue  .card-icon{background:var(--blue-bg);color:var(--blue)}
.clabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500}
.cval{font-size:30px;font-weight:700;letter-spacing:-.03em;font-family:var(--mono)}
.card.total .cval{color:var(--purple)}
.card.green .cval{color:var(--green)}
.card.amber .cval{color:var(--amber)}
.card.blue  .cval{color:var(--blue)}
.ctag{font-size:11px;color:var(--muted2);margin-top:3px}

/* PROGRESS */
.prog-section{margin-bottom:1.25rem;background:var(--surface);border-radius:var(--rl);padding:1.1rem 1.4rem;box-shadow:var(--sh)}
.prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.prog-pct{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--green)}
.prog-track{height:10px;background:var(--surface3);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#059669,#10b981,#34d399);transition:width .9s cubic-bezier(.4,0,.2,1);position:relative}
.prog-fill::after{content:'';position:absolute;right:0;top:0;height:100%;width:40px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.45));animation:shimmer 2s infinite}
@keyframes shimmer{0%,100%{opacity:0}50%{opacity:1}}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted2);margin-top:7px;font-family:var(--mono)}

/* PANEL */
.panel{background:var(--surface);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.panel-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2)}
.panel-head-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text)}
.count-badge{font-size:11px;background:var(--accent-lt);color:var(--accent);padding:2px 8px;border-radius:20px;font-family:var(--mono);font-weight:600}

/* FILTERS */
.filters{display:flex;gap:6px}
.filter-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--muted);cursor:pointer;font-family:var(--font);font-weight:500;transition:all .15s}
.filter-btn:hover{background:var(--accent-lt);color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);text-align:left;padding:10px 18px;border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:var(--surface2)}
td{font-size:13px;padding:12px 18px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background .12s}
tr:last-child td{border-bottom:none}
tr.data-row:hover td{background:var(--surface2)}
tr.data-row{-webkit-animation:fadeIn .3s ease both;animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;-webkit-transform:translateY(5px);transform:translateY(5px)}to{opacity:1;-webkit-transform:none;transform:none}}
.id-cell{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-lt);padding:3px 8px;border-radius:6px;display:inline-block;font-weight:600}
.task-name{font-weight:500;color:var(--text)}
.date-cell{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface3);padding:3px 8px;border-radius:6px;display:inline-block}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.badge.y{background:var(--green-bg);color:var(--green-txt);border:1px solid var(--green-bd)}
.badge.n{background:var(--amber-bg);color:var(--amber-txt);border:1px solid var(--amber-bd)}
.badge.p{background:var(--surface3);color:var(--muted);border:1px solid var(--border)}
.dot-indicator{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge.y .dot-indicator{background:var(--green)}
.badge.n .dot-indicator{background:var(--amber)}
.badge.p .dot-indicator{background:var(--muted2)}

/* STATES */
.state{text-align:center;padding:3rem;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.loader{display:flex;gap:5px}
.loader span{width:7px;height:7px;border-radius:50%;background:var(--accent);-webkit-animation:bounce .9s infinite;animation:bounce .9s infinite}
.loader span:nth-child(2){-webkit-animation-delay:.15s;animation-delay:.15s}
.loader span:nth-child(3){-webkit-animation-delay:.3s;animation-delay:.3s}
@keyframes bounce{0%,60%,100%{-webkit-transform:translateY(0);transform:translateY(0)}30%{-webkit-transform:translateY(-8px);transform:translateY(-8px)}}
.err{color:var(--red);font-size:13px;padding:1.25rem 1.5rem;background:var(--red-bg);display:flex;align-items:flex-start;gap:10px}
.footer{font-size:11px;color:var(--muted2);text-align:right;padding:10px 18px;border-top:1px solid var(--border);font-family:var(--mono);background:var(--surface2)}
.empty-state{padding:3rem;text-align:center}
.empty-icon{font-size:36px;color:var(--muted2);margin-bottom:12px}
.empty-msg{font-size:14px;color:var(--muted)}
@media(max-width:480px){
  .topbar{-webkit-flex-direction:column;flex-direction:column;align-items:flex-start;gap:12px}
  .date-pill{display:none}
  td,th{padding:10px 12px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-icon"><i class="ti ti-checklist"></i></div>
      <div>
        <div class="brand">My Dream Foods</div>
        <div class="title">EA Daily Checklist - Rishika</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="date-pill" id="today"></div>
      <button class="btn" id="refresh-btn" onclick="loadData()"><i class="ti ti-refresh"></i>Refresh</button>
    </div>
  </div>

  <div id="cards" class="cards" style="display:none">
    <div class="card total">
      <div class="card-top-bar"></div>
      <div class="card-icon"><i class="ti ti-layout-list"></i></div>
      <div class="clabel">Total Tasks</div>
      <div class="cval" id="c-total">0</div>
      <div class="ctag">all tasks</div>
    </div>
    <div class="card green">
      <div class="card-top-bar"></div>
      <div class="card-icon"><i class="ti ti-circle-check"></i></div>
      <div class="clabel">Completed</div>
      <div class="cval" id="c-done">0</div>
      <div class="ctag">done today</div>
    </div>
    <div class="card amber">
      <div class="card-top-bar"></div>
      <div class="card-icon"><i class="ti ti-clock-hour-4"></i></div>
      <div class="clabel">Pending</div>
      <div class="cval" id="c-pend">0</div>
      <div class="ctag">remaining</div>
    </div>
    <div class="card blue">
      <div class="card-top-bar"></div>
      <div class="card-icon"><i class="ti ti-chart-pie"></i></div>
      <div class="clabel">Completion</div>
      <div class="cval" id="c-pct">0%</div>
      <div class="ctag">of total</div>
    </div>
  </div>

  <div id="prog-section" class="prog-section" style="display:none">
    <div class="prog-header">
      <span class="prog-title"><i class="ti ti-trending-up" style="margin-right:6px;vertical-align:-2px;font-size:15px"></i>Overall Progress</span>
      <span class="prog-pct" id="prog-pct">0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-labels"><span id="prog-done-lbl">0 completed</span><span id="prog-total-lbl">0 total</span></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-head-left">
        <i class="ti ti-table" style="font-size:15px"></i>
        Tasks
        <span class="count-badge" id="task-count">—</span>
      </div>
      <div class="filters" id="filters" style="display:none">
        <button class="filter-btn active" onclick="applyFilter('all',this)">All</button>
        <button class="filter-btn" onclick="applyFilter('yes',this)">Done</button>
        <button class="filter-btn" onclick="applyFilter('no',this)">Pending</button>
      </div>
    </div>
    <div id="content"><div class="state"><div class="loader"><span></span><span></span><span></span></div></div></div>
  </div>

</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzkAjGfoL7zPLtHutRVW53C1aNSiANHHgrF99LKHKLWpj8LPxwpF9s7dNahNAJW6XpYdg/exec";
let allTasks = [];

const _now = new Date();
const _days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const _months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('today').textContent = _days[_now.getDay()] + ', ' + _now.getDate() + ' ' + _months[_now.getMonth()] + ' ' + _now.getFullYear();

function findCols(headers) {
  const h = headers.map(v => String(v).toLowerCase().trim());
  return {
    task:   h.findIndex(v => v === 'task' || (v.includes('task') && !v.includes('id') && !v.includes('complete'))),
    status: h.findIndex(v => v.includes('status') || v.includes('complete') || v.includes('y-n') || v.includes('y/n')),
    id:     h.findIndex(v => v.includes('id')),
    date:    h.findIndex(v => v.includes('planned') && !v.includes('revised')),
    revised: h.findIndex(v => v.includes('revised')),
    link:    h.findIndex(v => v.includes('link'))
  };
}

function safeDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function safeDateTime(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' + h + ':' + m + ' ' + ampm;
}

function formatDate(val) {
  if (!val && val !== 0) return '—';
  const s = String(val).trim();
  if (!s || s === '0') return '—';
  if (/^\d{4,6}$/.test(s)) {
    const d = new Date((Number(s) - 25569) * 86400 * 1000);
    if (!isNaN(d)) return safeDate(d);
  }
  const d = new Date(s);
  if (!isNaN(d)) return safeDate(d);
  return s;
}

function extractLink(val) {
  if (!val) return '';
  const hrefMatch = val.match(/href=["']([^"']+)["']/i);
  if (hrefMatch) return hrefMatch[1];
  if (val.startsWith('http')) return val;
  return '';
}

function normalizeStatus(val) {
  const v = String(val).toLowerCase().trim();
  if (v === 'yes' || v === 'y') return 'yes';
  if (v === 'no'  || v === 'n') return 'no';
  return v || 'pending';
}

function badgeHTML(s) {
  if (s === 'yes') return `<span class="badge y"><span class="dot-indicator"></span>Done</span>`;
  if (s === 'no')  return `<span class="badge n"><span class="dot-indicator"></span>Not done</span>`;
  return `<span class="badge p"><span class="dot-indicator"></span>${s || 'Pending'}</span>`;
}

function animateCount(el, target) {
  const dur = 800, start = performance.now();
  const isPercent = String(target).includes('%');
  const num = parseInt(target);
  function step(now) {
    const p = Math.min((now - start) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(ease * num) + (isPercent ? '%' : '');
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderRows(tasks) {
  if (!tasks.length) return `<div class="empty-state"><div class="empty-icon"><i class="ti ti-mood-empty"></i></div><div class="empty-msg">No tasks match this filter</div></div>`;
  return `<table>
    <thead><tr>
      <th style="width:60px">ID</th>
      <th>Task</th>
      <th style="width:120px">Planned Date</th>
      <th style="width:130px">Revised Date</th>
      <th style="width:120px">Status</th>
    </tr></thead>
    <tbody>
      ${tasks.map((t,i) => `<tr class="data-row" style="animation-delay:${i*40}ms">
        <td><span class="id-cell">${t.id || i+1}</span></td>
        <td><span class="task-name">${t.task}</span></td>
        <td><span class="date-cell">${t.date || '—'}</span></td>
        <td><span class="date-cell">${t.revised || '—'}</span></td>
        <td>${badgeHTML(t.status)}</td>
      </tr>`).join('')}
    </tbody>
  </table>
  <div class="footer">Updated: ${safeDateTime(new Date())}</div>`;
}

function applyFilter(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = filter === 'all' ? allTasks : allTasks.filter(t => t.status === filter || (filter === 'no' && t.status !== 'yes'));
  document.getElementById('content').innerHTML = renderRows(filtered);
}

function processData(json) {
  const taskMap = {};
  for (const sheetName of Object.keys(json)) {
    const rows = json[sheetName];
    if (!rows || rows.length < 2) continue;
    const cols = findCols(rows[0]);
    if (cols.task === -1) continue;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const task = String(row[cols.task] || '').trim();
      if (!task || task.toLowerCase() === 'task') continue;
      const id = cols.id >= 0 ? String(row[cols.id] || '').trim() : String(i);
      const key = id || task;
      if (!taskMap[key]) taskMap[key] = { id, task, status:'', date:'', revised:'' };
      const t = taskMap[key];
      if (cols.status >= 0 && row[cols.status])  t.status  = normalizeStatus(row[cols.status]);
      if (cols.date   >= 0 && row[cols.date])    t.date    = formatDate(row[cols.date]);
      if (cols.revised>= 0 && row[cols.revised]) t.revised = formatDate(row[cols.revised]);
    }
  }
  const tasks = Object.values(taskMap);
  allTasks = tasks;

  const total = tasks.length;
  const done  = tasks.filter(t => t.status === 'yes').length;
  const pend  = total - done;
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('cards').style.display = 'grid';
  document.getElementById('prog-section').style.display = 'block';
  document.getElementById('filters').style.display = 'flex';
  document.getElementById('task-count').textContent = total;

  setTimeout(() => {
    animateCount(document.getElementById('c-total'), total);
    animateCount(document.getElementById('c-done'),  done);
    animateCount(document.getElementById('c-pend'),  pend);
    animateCount(document.getElementById('c-pct'),   pct + '%');
    animateCount(document.getElementById('prog-pct'), pct + '%');
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('prog-done-lbl').textContent = done + ' completed';
    document.getElementById('prog-total-lbl').textContent = total + ' total';
  }, 100);

  document.getElementById('content').innerHTML = renderRows(tasks);
}

async function loadData() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('filters').style.display = 'none';
  document.getElementById('content').innerHTML = `<div class="state"><div class="loader"><span></span><span></span><span></span></div></div>`;
  try {
    const res = await fetch(GAS_URL, { method: 'GET', mode: 'cors', redirect: 'follow', cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const json = JSON.parse(text);
    processData(json);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="err"><i class="ti ti-alert-triangle" style="flex-shrink:0;font-size:16px;margin-top:1px"></i><span>${e.message}. Ensure Apps Script is deployed with <strong>Anyone</strong> access.</span></div>`;
  } finally {
    btn.classList.remove('spinning');
  }
}

loadData();
</script>
</body>
</html>
